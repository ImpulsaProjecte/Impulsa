<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contacte - IMPULSA+</title>
  <meta name="description" content="Contacta amb IMPULSA+. Estem aquí per escoltar-te. Omple el formulari o truca'ns per parlar de la teva idea o del teu futur professional.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            blau: '#1e3a8a',
            taronja: '#f59e0b',
            gris: '#f3f4f6',
            futur: '#0f172a',
            'futur-light': '#1e293b',
          },
          animation: {
            'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
          },
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
          },
        },
      },
    };
  </script>
  <style>
    body {
      overflow-y: scroll;
      background-color: #0f172a;
    }
    body.no-scroll { overflow: hidden; }
    .video-background-container {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; z-index: -20;
    }
    .video-background-container video {
      width: 100%; height: 100%; object-fit: cover;
    }
    .body-gradient-overlay {
      position: fixed; inset: 0; z-index: -10; width: 100%; height: 100%;
      background: radial-gradient(circle at 60% 40%, rgba(30, 58, 138, 0.4) 0%, rgba(15, 23, 42, 0.8) 60%, #000 100%);
      opacity: 0.9;
    }
  </style>
</head>
<body class="min-h-screen text-white font-sans">

  <!-- Fons de vídeo -->
  <div class="video-background-container">
    <video playsinline autoplay muted loop poster="poster.jpg">
      <source src="https://cdn.pixabay.com/video/2020/03/02/33238-401494953.mp4" type="video/mp4">
    </video>
  </div>
  <div class="body-gradient-overlay"></div>

  <!-- Navbar -->
  <nav class="bg-futur/80 backdrop-blur-sm shadow-lg fixed w-full z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <img src="LOGOS/+IMPULSA.FONDO.png" alt="Logo IMPULSA" class="w-10 h-10" />
        <span style="color:#3b9cd6; font-weight:bold; font-size:1.25rem;">IMPULSA</span><span style="color:#f59e0b; font-weight:bold; margin-left:-7px; font-size:1.25rem;">+</span>
      </a>
    </div>
  </nav>

  <!-- Contingut -->
  <main class="max-w-6xl mx-auto px-4 pt-32 pb-20 sm:pt-40">
    <section class="animate-fade-in-up opacity-0">

      <div class="text-center mb-16">
        <h2 class="text-4xl sm:text-5xl font-bold bg-gradient-to-r from-taronja to-amber-300 bg-clip-text text-transparent">Parlem? Fes el Primer Pas.</h2>
        <p class="mt-4 text-lg text-white/80 max-w-2xl mx-auto">Omple el formulari i ens posarem en contacte amb tu.</p>
      </div>

      <!-- Formulari -->
      <div class="max-w-3xl mx-auto">
        <form id="formulari" action="https://formsubmit.co/impulsames45@gmail.com" method="POST"
          class="bg-blau/20 backdrop-blur-md border border-blau/30 rounded-2xl shadow-2xl p-8 flex flex-col gap-6">

          <input type="hidden" name="_captcha" value="false">
          <input type="hidden" name="_template" value="table">
          <input type="hidden" name="_subject" value="Nou missatge des del web d'IMPULSA+">
          <input type="hidden" name="_autoresponse" value="Gràcies pel teu missatge! Ens posarem en contacte amb tu aviat.">

          <div>
            <label for="nom" class="font-medium text-gris mb-2 block">Nom *</label>
            <input type="text" id="nom" name="nom" required class="w-full bg-futur/50 border border-blau/50 rounded-lg py-2.5 px-3 text-white">
          </div>

          <div>
            <label for="email" class="font-medium text-gris mb-2 block">Correu electrònic *</label>
            <input type="email" id="email" name="email" required class="w-full bg-futur/50 border border-blau/50 rounded-lg py-2.5 px-3 text-white">
          </div>

          <div>
            <label for="missatge" class="font-medium text-gris mb-2 block">Missatge *</label>
            <textarea id="missatge" name="missatge" rows="4" required class="w-full bg-futur/50 border border-blau/50 rounded-lg px-3 py-2 text-white"></textarea>
          </div>

          <button type="submit" class="w-full bg-taronja text-futur font-bold px-6 py-3 rounded-full mt-4 hover:bg-white transition-all">Enviar</button>
        </form>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="bg-futur-light border-t border-white/10 text-white/70 pt-16 pb-8 text-center">
    <p class="text-white/50 text-sm">© 2025 IMPULSA+. Tots els drets reservats.</p>
  </footer>

  <!-- Script per enviar + redirigir -->
  <script>
    document.getElementById('formulari').addEventListener('submit', function(e) {
      e.preventDefault();
      const data = new FormData(this);
      fetch(this.action, {
        method: 'POST',
        body: data,
        headers: { 'Accept': 'application/json' }
      }).then(() => {
        window.location.href = 'missatge-enviat.html';
      }).catch(() => {
        alert('Hi ha hagut un error en enviar el formulari.');
      });
    });
    lucide.createIcons();
  </script>

</body>
</html>
