<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />

  <title>Contacte - IMPULSA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            blau: '#1e3a8a',
            taronja: '#f59e0b',
            gris: '#f3f4f6',
            futur: '#0f172a'
          },
          animation: {
            'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
          },
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
          },
        },
      },
    };
  </script>
  <style>
    /* Permet l'scroll a la pàgina principal per defecte */
    body {
      overflow-y: scroll;
      background-color: #0f172a; /* Color de fons de reserva */
    }
    /* Classe per bloquejar l'scroll del body quan el menú mòbil està obert */
    body.no-scroll {
      overflow: hidden;
    }
    /* Fa que el menú mòbil pugui fer scroll internament si el seu contingut és llarg */
    #mobile-menu {
      max-height: calc(100vh - 64px); /* Ajusta a l'altura de la teva barra de navegació */
      overflow-y: auto;
    }

    /* Contenidor del vídeo de fons */
    .video-background-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: -20;
    }
    .video-background-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Gradient superposat per millorar la llegibilitat */
    .body-gradient-overlay {
      position: fixed;
      inset: 0;
      z-index: -10;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 60% 40%, rgba(30, 58, 138, 0.4) 0%, rgba(15, 23, 42, 0.8) 60%, #000 100%);
      opacity: 0.9;
    }
  </style>
</head>
<body class="min-h-screen text-white font-sans">

      <button id="menu-toggle" class="md:hidden text-white focus:outline-none">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />

       <div class="hidden md:flex items-center gap-6 text-white font-semibold">

        <a href="colaboracio.html" class="hover:text-taronja transition-colors duration-300">Col·laboració</a>
        <a href="contacte.html" class="bg-taronja text-futur px-4 py-2 rounded-full hover:bg-white transition-all duration-300">Contacte</a>

    <div id="mobile-menu" class="md:hidden hidden bg-futur/95 backdrop-blur-xl">
      <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3 text-center">

      </div>

  <script>
    const menuToggle = document.getElementById("menu-toggle");
    const mobileMenu = document.getElementById("mobile-menu");
    const body = document.body;

    menuToggle.addEventListener("click", () => {
      mobileMenu.classList.toggle("hidden");
      body.classList.toggle("no-scroll");
    });
  </script>

  <main class="max-w-5xl mx-auto px-4 pt-32 pb-20 sm:pt-40">
    <section id="contacte" aria-label="Contacte" class="animate-fade-in-up opacity-0">
      <h2 class="text-4xl sm:text-5xl font-bold mb-12 text-center bg-gradient-to-r from-taronja to-amber-300 bg-clip-text text-transparent drop-shadow-lg">
        Contacta'ns
      </h2>

      <form action="https://formsubmit.co/impulsames45@gmail.com" method="POST"
        class="bg-blau/20 backdrop-blur-md border border-blau/30 rounded-2xl shadow-2xl p-8 max-w-lg mx-auto flex flex-col gap-6"
        aria-label="Formulari de contacte">

        <input type="hidden" name="_next" value="https://impulsaprojecte.github.io/Impulsa/missatge-enviat.html" />
        <input type="hidden" name="_captcha" value="false" />

        <!-- Camp Nom -->
        <div>
          <label for="nom" class="font-medium text-gris mb-1 block">Nom *</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3">
              <svg class="w-5 h-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" /></svg>
            </span>
            <input type="text" id="nom" name="nom" required class="w-full bg-futur/50 border border-blau/50 rounded-lg px-3 py-2 pl-10 text-white focus:outline-none focus:ring-2 focus:ring-taronja" placeholder="Escriu el teu nom" />
          </div>
        </div>

        <!-- Camp Email -->
        <div>
          <label for="email" class="font-medium text-gris mb-1 block">Correu electrònic *</label>
          <div class="relative">
             <span class="absolute inset-y-0 left-0 flex items-center pl-3">
               <svg class="w-5 h-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" /><path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" /></svg>
            </span>
            <input type="email" id="email" name="email" required class="w-full bg-futur/50 border border-blau/50 rounded-lg px-3 py-2 pl-10 text-white focus:outline-none focus:ring-2 focus:ring-taronja" placeholder="Escriu el teu correu" />
          </div>
        </div>

        <!-- Camp Motiu -->
        <div>
          <label for="motiu" class="font-medium text-gris mb-1 block">Motiu de la consulta *</label>
           <div class="relative">
             <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                <svg class="w-5 h-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9 5.25h.008v.008H12v-.008z" /></svg>
             </span>
            <select id="motiu" name="motiu" required class="w-full appearance-none bg-futur/50 border border-blau/50 rounded-lg px-3 py-2 pl-10 text-white focus:outline-none focus:ring-2 focus:ring-taronja">
              <option value="" class="text-gray-500">Selecciona una opció</option>
              <option value="informacio" class="text-black">Vull més informació</option>
              <option value="inscripcio" class="text-black">Vull inscriure'm al programa</option>
              <option value="colaboracio" class="text-black">Vull col·laborar amb el projecte</option>
              <option value="altres" class="text-black">Altres</option>
            </select>
          </div>
        </div>

        <!-- Camp Missatge -->
        <div>
          <label for="missatge" class="font-medium text-gris mb-1 block">Missatge</label>
          <textarea id="missatge" name="missatge" rows="4" class="w-full bg-futur/50 border border-blau/50 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-taronja" placeholder="Escriu la teva consulta..."></textarea>
        </div>

        <button type="submit" class="bg-taronja text-blau font-bold px-6 py-3 rounded-full mt-4 transition-all duration-300 transform hover:bg-blau hover:text-white hover:scale-105 focus:outline-none focus:ring-2 focus:ring-taronja focus:ring-offset-2 focus:ring-offset-futur">
          Envia Missatge
        </button>
      </form>

      <!-- Contacte alternatiu -->
       <div class="mt-12 text-center bg-blau/20 backdrop-blur-md border border-blau/30 rounded-2xl shadow-2xl p-6 max-w-lg mx-auto">
          <h3 class="text-lg font-semibold text-white mb-4">O contacta'ns directament</h3>
          <div class="flex flex-col sm:flex-row justify-center items-center gap-6">
              <a href="mailto:impulsames45@gmail.com" class="flex items-center gap-2 text-gris hover:text-taronja transition-colors duration-300">
                  <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" /><path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" /></svg>
                  <span>impulsames45@gmail.com</span>
              </a>
              <a href="tel:+34627113914" class="flex items-center gap-2 text-gris hover:text-taronja transition-colors duration-300">
                   <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M2 3.5A1.5 1.5 0 013.5 2h1.148a1.5 1.5 0 011.465 1.175l.716 3.223a1.5 1.5 0 01-1.052 1.767l-.933.267c-.41.117-.643.555-.48.95a11.542 11.542 0 006.254 6.254c.395.163.833-.07.95-.48l.267-.933a1.5 1.5 0 011.767-1.052l3.223.716A1.5 1.5 0 0118 15.352V16.5a1.5 1.5 0 01-1.5 1.5h-2.148a1.5 1.5 0 01-1.465-1.175l-.716-3.223a1.5 1.5 0 00-1.052-1.767l-.933-.267c-.41-.117-.643-.555-.48-.95a11.542 11.542 0 01-6.254-6.254c-.395-.163-.833.07-.95-.48l-.267-.933A1.5 1.5 0 002 4.648V3.5z" clip-rule="evenodd" /></svg>
                  <span>+34 627 113 914</span>
              </a>
          </div>
      </div>
    </section>
