<!DOCTYPE html>
<html lang="ca">
     <script async src="https://eu.umami.is/script.js" data-website-id="e586379d-7e4b-4d43-9d55-48cdffa8d0fe"></script>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Redirecció automàtica als 7 segons com a alternativa -->
  <meta http-equiv="refresh" content="7;url=index.html">
  <title>Gràcies per Subscriure't - IMPULSA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            blau: '#1e3a8a',
            taronja: '#f59e0b',
            gris: '#f3f4f6',
            futur: '#0f172a'
          },
          animation: {
            'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
            'draw-check': 'drawCheck 1s ease-in-out forwards',
          },
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            drawCheck: {
              '0%': { 'stroke-dashoffset': '1' },
              '100%': { 'stroke-dashoffset': '0' },
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0f172a;
      overflow: hidden; /* Evita l'scroll en aquesta pàgina */
    }
    
    .video-background-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: -20;
    }
    .video-background-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .body-gradient-overlay {
      position: fixed;
      inset: 0;
      z-index: -10;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 60% 40%, rgba(30, 58, 138, 0.4) 0%, rgba(15, 23, 42, 0.8) 60%, #000 100%);
      opacity: 0.9;
    }

    /* Estils per a l'animació del 'check' */
    .checkmark__path {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: drawCheck 0.8s 0.3s ease-out forwards;
    }
  </style>
</head>
<body class="min-h-screen text-white font-sans flex items-center justify-center p-4">

  <!-- Fons de Vídeo -->
  <div class="video-background-container">
    <video playsinline autoplay muted loop>
      <source src="https://cdn.pixabay.com/video/2020/03/02/33238-401494953.mp4" type="video/mp4">
      El teu navegador no suporta vídeos HTML5.
    </video>
  </div>
  <div class="body-gradient-overlay"></div>

  <!-- Contingut Principal -->
  <main class="max-w-md w-full mx-auto text-center">
    <div class="bg-blau/20 backdrop-blur-md border border-blau/30 rounded-2xl shadow-2xl p-8 animate-fade-in-up opacity-0">
      
      <!-- Icona Animada -->
      <div class="mx-auto mb-6 h-24 w-24">
        <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130.2 130.2">
            <circle class="stroke-current text-taronja/30" fill="none" stroke-width="6" stroke-miterlimit="10" cx="65.1" cy="65.1" r="62.1"/>
            <polyline class="checkmark__path stroke-current text-taronja" fill="none" stroke-width="8" stroke-linecap="round" stroke-miterlimit="10" points="100.2,40.2 51.5,88.8 29.8,67.5 "/>
        </svg>
      </div>

      <h1 class="text-3xl font-extrabold mb-4 text-white">Subscripció Confirmada!</h1>
      <p class="text-lg text-gris max-w-sm mx-auto mb-8">
        La teva subscripció s'ha completat amb èxit. A partir d'ara, rebràs les nostres novetats al teu correu. Gràcies per unir-te a la comunitat IMPULSA!
      </p>

      <a href="index.html" class="bg-taronja text-futur font-bold text-lg px-8 py-3 rounded-full shadow-lg transition-all duration-300 transform hover:bg-white hover:text-futur hover:scale-105 focus:outline-none focus:ring-2 focus:ring-taronja focus:ring-offset-2 focus:ring-offset-futur">
        Tornar a l'inici
      </a>
      
      <p id="countdown-message" class="text-sm text-gray-400 mt-8">
        Seràs redirigit automàticament en 7 segons...
      </p>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      let countdownSeconds = 7;
      const countdownElement = document.getElementById('countdown-message');
      const redirectUrl = 'index.html'; // Pàgina a la que redirigir

      const interval = setInterval(() => {
        countdownSeconds--;
        countdownElement.textContent = `Seràs redirigit automàticament en ${countdownSeconds} segons...`;

        if (countdownSeconds <= 0) {
          clearInterval(interval);
          window.location.href = redirectUrl;
        }
      }, 1000);
    });
  </script>

</body>
</html>
