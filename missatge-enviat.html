<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Missatge enviat - IMPULSA</title>
  <script src="https://cdn.tailwindcss.com"></script>
    <style>
  .body-gradient {
    background: radial-gradient(circle at 60% 40%, #2f4eb1 0%, #1e3a8a 40%, #0f172a 100%);
    opacity: 0.6;
    position: absolute;
    inset: 0;
    z-index: -10;
  }

  .futuristic-pattern-background {
    position: absolute;
    inset: 0;
    z-index: -20;
    background-image:
      linear-gradient(45deg, rgba(30, 58, 138, 0.05) 25%, transparent 25%, transparent 75%, rgba(30, 58, 138, 0.05) 75%, rgba(30, 58, 138, 0.05) 100%),
      linear-gradient(-45deg, rgba(30, 58, 138, 0.05) 25%, transparent 25%, transparent 75%, rgba(30, 58, 138, 0.05) 75%, rgba(30, 58, 138, 0.05) 100%),
      radial-gradient(circle, rgba(245, 158, 11, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(15, 23, 42, 0.03) 1px, transparent 1px),
      linear-gradient(rgba(15, 23, 42, 0.03) 1px, transparent 1px);
    background-size:
      40px 40px,
      40px 40px,
      8px 8px,
      50px 50px,
      50px 50px;
    background-position: 0 0;
    opacity: 1;
  }
</style>
  <style>
    body { overflow-y: scroll; }

    /* Estils per al vídeo de fons */
    .video-background-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .video-background-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    body {
  position: relative;
  background-color: #0f172a;
  min-height: 100vh;
  overflow-x: hidden;
}

.body-gradient,
.futuristic-pattern-background {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
}

 </style>
</head>
<body class="min-h-screen text-white font-sans bg-futur">
  <div aria-hidden="true" class="body-gradient"></div>
  <div aria-hidden="true" class="futuristic-pattern-background"></div>
</head>
<body class="min-h-screen text-white font-sans bg-gradient-to-br from-blau via-futur to-black relative overflow-hidden">
  <!-- Fons decoratiu -->
  <div style="position:absolute;inset:0;z-index:-10;width:100vw;height:100vh;
    background: radial-gradient(circle at 60% 40%, #1e3a8a 0%, #0f172a 60%, #000 100%);
    opacity:0.9;"></div>

  <!-- Contingut principal -->
  <main class="max-w-4xl mx-auto px-4 pt-40 pb-20 text-center">
    <h1 class="text-4xl font-extrabold mb-6 text-taronja">Gràcies per contactar!</h1>
    <p class="text-xl text-white max-w-2xl mx-auto mb-8">
      Hem rebut el teu missatge correctament. Ens posarem en contacte amb tu pròximament.
    </p>
    <a href="contacte.html" class="bg-taronja text-blau font-bold text-lg px-10 py-4 rounded-full shadow-lg hover:bg-white hover:text-taronja transition-all">
      ← Tornar a la pàgina de contacte
    </a>
  </main>

  <!-- Peu de pàgina -->
  <footer class="bg-futur text-white text-center py-6" aria-label="Peu de pàgina">
    <p>&copy; 2025 IMPULSA. Dissenyat amb propòsit i passió.</p>
  </footer>
</body>
</html>
